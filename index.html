<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Homework</title>
    
    <!-- 頁面初始化：讀取主題並動態注入 Safari theme-color -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('user-theme') || 'blue';
            document.documentElement.setAttribute('data-theme', savedTheme);

            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const themeBgColor = isDark ? '#0b1329' : '#f4f5f7';

            const meta = document.createElement('meta');
            meta.name = 'theme-color';
            meta.content = themeBgColor;
            document.getElementsByTagName('head')[0].appendChild(meta);
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>

    <style>
        :root { 
            --bg-main: #f4f5f7;
            --text-main: #1f2937;

            --theme-color: #2563eb;
            --theme-text: #2563eb;
            --theme-glow: rgba(37, 99, 235, 0.25); /* 亮色模式維持適度光暈 */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0b1329;
                --text-main: #f8fafc;

                --theme-text: #60a5fa;
                --theme-glow: rgba(96, 165, 250, 0.12); /* 深色模式：大幅削弱主題光暈 */
            }
        }

        /* 8 種主題色彩設定 */
        [data-theme="blue"] { --theme-color: #2563eb; --theme-text: #2563eb; --theme-glow: rgba(37, 99, 235, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="blue"] { --theme-text: #60a5fa; --theme-glow: rgba(96, 165, 250, 0.12); } }

        [data-theme="emerald"] { --theme-color: #059669; --theme-text: #059669; --theme-glow: rgba(5, 150, 105, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="emerald"] { --theme-text: #34d399; --theme-glow: rgba(52, 211, 153, 0.12); } }

        [data-theme="purple"] { --theme-color: #7c3aed; --theme-text: #7c3aed; --theme-glow: rgba(124, 58, 237, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="purple"] { --theme-text: #a78bfa; --theme-glow: rgba(167, 139, 250, 0.12); } }

        [data-theme="amber"] { --theme-color: #d97706; --theme-text: #d97706; --theme-glow: rgba(217, 119, 6, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="amber"] { --theme-text: #fbbf24; --theme-glow: rgba(251, 191, 36, 0.12); } }

        [data-theme="rose"] { --theme-color: #e11d48; --theme-text: #e11d48; --theme-glow: rgba(225, 29, 72, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="rose"] { --theme-text: #fb7185; --theme-glow: rgba(251, 113, 133, 0.12); } }

        [data-theme="cyan"] { --theme-color: #0891b2; --theme-text: #0891b2; --theme-glow: rgba(8, 145, 178, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="cyan"] { --theme-text: #22d3ee; --theme-glow: rgba(34, 211, 238, 0.12); } }

        [data-theme="indigo"] { --theme-color: #4f46e5; --theme-text: #4f46e5; --theme-glow: rgba(79, 70, 229, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="indigo"] { --theme-text: #818cf8; --theme-glow: rgba(129, 140, 248, 0.12); } }

        [data-theme="slate"] { --theme-color: #475569; --theme-text: #475569; --theme-glow: rgba(71, 85, 105, 0.25); }
        @media (prefers-color-scheme: dark) { [data-theme="slate"] { --theme-text: #94a3b8; --theme-glow: rgba(148, 163, 184, 0.12); } }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background-color: var(--bg-main);
        }

        /* -------------------------------------
           Liquid Glass 卡片
           ------------------------------------- */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            box-shadow: 
                0 0 20px 0 rgba(255, 255, 255, 0.5) inset,
                0 10px 30px -5px rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            .liquid-glass {
                background: rgba(21, 31, 56, 0.45);
                backdrop-filter: blur(24px) saturate(190%);
                -webkit-backdrop-filter: blur(24px) saturate(190%);
                /* 深色模式：細邊框、極微弱高光 */
                border: 1px solid rgba(255, 255, 255, 0.06);
                box-shadow: 
                    0 0 10px 0 rgba(255, 255, 255, 0.02) inset,
                    0 12px 35px -5px rgba(0, 0, 0, 0.45);
            }
        }

        /* -------------------------------------
           Liquid Glass 按鈕
           ------------------------------------- */
        .glass-btn {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 0 10px 0 rgba(255, 255, 255, 0.6) inset,
                0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-btn:hover {
            box-shadow: 
                0 0 15px 0 rgba(255, 255, 255, 0.9) inset,
                0 0 20px var(--theme-glow);
            transform: scale(1.02);
        }

        @media (prefers-color-scheme: dark) {
            .glass-btn {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 
                    0 0 8px 0 rgba(255, 255, 255, 0.03) inset,
                    0 4px 15px rgba(0, 0, 0, 0.3);
            }
            .glass-btn:hover {
                /* 深色模式懸停：收斂高光與光暈 */
                box-shadow: 
                    0 0 8px 0 rgba(255, 255, 255, 0.08) inset,
                    0 0 15px var(--theme-glow);
            }
        }

        /* -------------------------------------
           Liquid Glass 選單 (液體折射感)
           ------------------------------------- */
        .glass-menu-liquid {
            backdrop-filter: blur(20px) saturate(230%) contrast(108%);
            -webkit-backdrop-filter: blur(20px) saturate(230%) contrast(108%);
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.65), rgba(240, 240, 250, 0.45));
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 
                0 0 25px 0 rgba(255, 255, 255, 0.7) inset,
                0 20px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
        }

        @media (prefers-color-scheme: dark) {
            .glass-menu-liquid {
                background: radial-gradient(circle at 50% 0%, rgba(30, 45, 78, 0.6), rgba(15, 23, 42, 0.5));
                /* 深色模式選單：極細邊框與幾乎隱形的內發光 */
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 
                    0 0 15px 0 rgba(255, 255, 255, 0.03) inset,
                    0 20px 45px rgba(0, 0, 0, 0.65);
            }
        }

        .glass-menu-liquid::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% -20%, rgba(255, 255, 255, 0.4), transparent 70%);
            pointer-events: none;
        }

        @media (prefers-color-scheme: dark) {
            .glass-menu-liquid::before {
                /* 深色模式：減輕液體表面反光 */
                background: radial-gradient(ellipse at 50% -20%, rgba(255, 255, 255, 0.06), transparent 60%);
            }
        }

        .theme-bg { background-color: var(--theme-color) !important; }
        .theme-text { color: var(--theme-text); }
        .theme-spinner { border-top-color: var(--theme-color); }

        .calendar-day.active { 
            background-color: var(--theme-color) !important; 
            color: #ffffff !important; 
            font-weight: bold; 
            border-color: var(--theme-color) !important; 
            /* 光暈直接套用調暗後的變數 */
            box-shadow: 0 0 12px var(--theme-glow);
        }

        .hdr-image { dynamic-range: high; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header：與 Safari 頂欄 100% 融合 -->
    <header class="w-full max-w-7xl mx-auto px-4 md:px-6 pt-4 pb-2 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full theme-bg shadow-sm"></span>
            <h1 class="text-xl font-bold tracking-wide text-gray-800 dark:text-slate-100">Daily Homework</h1>
        </div>
        
        <!-- 右上角 Liquid Glass 風格 Theme 按鈕 -->
        <div class="relative">
            <button id="theme-menu-btn" onclick="toggleThemeMenu(event)" class="glass-btn px-4 py-2 rounded-2xl active:scale-95 flex items-center gap-2 cursor-pointer text-xs font-semibold text-gray-800 dark:text-slate-100">
                <svg class="w-4 h-4 theme-text stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4 5 5 0 013-4.586V12a7 7 0 0114 0v.414A5 5 0 0121 17a4 4 0 01-4 4h-1a2 2 0 01-2-2 1 1 0 00-1-1 1 1 0 00-1 1 2 2 0 01-2 2H7z" />
                </svg>
                <span>Theme</span>
            </button>

            <!-- 下拉選單 -->
            <div id="theme-menu" class="hidden absolute right-0 mt-3 w-52 glass-menu-liquid rounded-2xl p-2 z-50">
                <div class="text-xs font-semibold text-gray-600 dark:text-slate-400 px-3 py-1.5 mb-1 border-b border-black/10 dark:border-white/5 relative z-10">Select Theme Color</div>
                
                <div class="grid grid-cols-2 gap-1 relative z-10">
                    <button onclick="setTheme('blue')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-blue-600 shrink-0 shadow-sm"></span> Blue
                    </button>
                    <button onclick="setTheme('emerald')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-emerald-600 shrink-0 shadow-sm"></span> Emerald
                    </button>
                    <button onclick="setTheme('purple')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-purple-600 shrink-0 shadow-sm"></span> Purple
                    </button>
                    <button onclick="setTheme('amber')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-amber-600 shrink-0 shadow-sm"></span> Amber
                    </button>
                    <button onclick="setTheme('rose')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-rose-600 shrink-0 shadow-sm"></span> Rose
                    </button>
                    <button onclick="setTheme('cyan')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-cyan-600 shrink-0 shadow-sm"></span> Cyan
                    </button>
                    <button onclick="setTheme('indigo')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-indigo-600 shrink-0 shadow-sm"></span> Indigo
                    </button>
                    <button onclick="setTheme('slate')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-semibold text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-slate-600 shrink-0 shadow-sm"></span> Slate
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主布局內容 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- 左側：日曆卡片 -->
        <section id="left-calendar-card" class="lg:col-span-4 liquid-glass rounded-3xl p-5 flex flex-col justify-between h-fit">
            <div>
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-black/10 dark:border-white/5">
                    <button onclick="changeMonth(-1)" class="p-2 text-gray-700 dark:text-gray-300 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition font-bold">&lt;</button>
                    <h2 id="calendar-month-label" class="text-base font-bold text-gray-800 dark:text-slate-200"></h2>
                    <button onclick="changeMonth(1)" class="p-2 text-gray-700 dark:text-gray-300 hover:bg-black/5 dark:hover:bg-white/10 rounded-xl transition font-bold">&gt;</button>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            </div>

            <div class="mt-4 pt-3 border-t border-black/10 dark:border-white/5 text-xs text-gray-500 dark:text-gray-400 text-center">
                Selected: <span id="selected-date-label" class="font-bold text-gray-800 dark:text-slate-300"></span>
            </div>
        </section>

        <!-- 右側：內容卡片 -->
        <section id="right-content-card" class="lg:col-span-8 liquid-glass rounded-3xl p-5 flex flex-col min-h-[380px] justify-center items-center">
            
            <!-- Loading State -->
            <div id="loading-state" class="w-full flex-1 flex flex-col items-center justify-center">
                <div class="w-8 h-8 border-4 border-gray-300/40 theme-spinner rounded-full animate-spin"></div>
                <p class="text-gray-400 text-sm mt-3">Loading data...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden w-full flex-1 flex flex-col items-center justify-center text-gray-400 dark:text-gray-500">
                <svg class="w-14 h-14 mb-2 stroke-current opacity-40" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-base font-medium">No record for this date</p>
            </div>

            <!-- Content State -->
            <div id="content-state" class="hidden w-full flex-1 grid grid-cols-1 md:grid-cols-3 gap-5 items-stretch">
                <!-- Text Container -->
                <div class="md:col-span-2 flex flex-col h-full space-y-3">
                    <h3 class="text-base font-bold theme-text border-b pb-2 border-black/10 dark:border-white/5 flex items-center gap-2">
                        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span>Notes</span>
                    </h3>
                    <div id="text-container" class="flex-1 text-sm leading-relaxed whitespace-pre-line bg-black/5 dark:bg-black/25 p-4 rounded-2xl border border-black/5 dark:border-white/5"></div>
                </div>

                <!-- Image Container -->
                <div class="md:col-span-1 space-y-3 flex flex-col">
                    <h3 class="text-base font-bold theme-text border-b pb-2 border-black/10 dark:border-white/5 flex items-center gap-2">
                        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Attachment</span>
                    </h3>
                    <div id="image-container" class="rounded-2xl overflow-hidden border border-black/5 dark:border-white/5 shadow-sm bg-black/5 dark:bg-black/25 flex items-center justify-center flex-1">
                        <img id="daily-photo" src="" alt="Daily Photo" class="hdr-image w-full h-auto object-cover max-h-[350px] cursor-pointer" onclick="window.open(this.src, '_blank')">
                    </div>
                    <p id="no-img-label" class="text-xs text-gray-400 dark:text-gray-500 text-center hidden">No photo for today</p>
                </div>
            </div>

        </section>

    </main>

    <script>
        const GITHUB_USERNAME = "lkyam127";
        const GITHUB_REPO = "CSS_26-27_3B_HW_Photos";
        const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/images`;
        const API_CONTENTS_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/images`;

        const dataCache = {};
        let fileIndex = null;

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth() + 1;
        let selectedYear = currentYear;
        let selectedMonth = currentMonth;
        let selectedDay = today.getDate();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function toggleThemeMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('theme-menu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        function setTheme(themeName) {
            localStorage.setItem('user-theme', themeName);
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            renderCalendar();
            await fetchFileIndex();
            updateContent();
        });

        async function fetchFileIndex() {
            try {
                const res = await fetch(API_CONTENTS_URL);
                if (res.ok) {
                    const files = await res.json();
                    fileIndex = {};
                    files.forEach(f => { fileIndex[f.name] = true; });
                }
            } catch (e) {
                console.error("Failed to fetch file index", e);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }

            selectedYear = currentYear;
            selectedMonth = currentMonth;
            const daysInNewMonth = new Date(selectedYear, selectedMonth, 0).getDate();
            if (selectedDay > daysInNewMonth) selectedDay = daysInNewMonth;

            renderCalendar();
            updateContent();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-label').innerText = `${monthNames[currentMonth - 1]} ${currentYear}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            weekdays.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'text-center text-xs font-bold text-gray-500 dark:text-slate-400 py-1';
                div.innerText = wd;
                grid.appendChild(div);
            });

            const firstDayIndex = (new Date(currentYear, currentMonth - 1, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= totalDays; d++) {
                const btn = document.createElement('button');
                const isSelected = (d === selectedDay && currentMonth === selectedMonth && currentYear === selectedYear);
                btn.className = `calendar-day aspect-square flex items-center justify-center text-xs rounded-xl border border-black/5 dark:border-white/5 text-gray-800 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-white/10 transition ${isSelected ? 'active' : 'bg-black/5 dark:bg-white/5'}`;
                btn.innerText = d;
                btn.onclick = () => {
                    selectedYear = currentYear;
                    selectedMonth = currentMonth;
                    selectedDay = d;
                    renderCalendar();
                    updateContent();
                };
                grid.appendChild(btn);
            }
        }

        async function updateContent() {
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            const content = document.getElementById('content-state');
            const textContainer = document.getElementById('text-container');
            const img = document.getElementById('daily-photo');
            const noImgLabel = document.getElementById('no-img-label');
            const imgContainer = document.getElementById('image-container');

            const monthStr = selectedMonth.toString().padStart(2, '0');
            const dayStr = selectedDay.toString().padStart(2, '0');
            const dateKey = `${selectedYear}-${monthStr}-${dayStr}`;

            document.getElementById('selected-date-label').innerText = `${monthNames[selectedMonth - 1]} ${dayStr}, ${selectedYear}`;

            let textResult = null;
            let imgUrl = null;

            if (dataCache[dateKey]) {
                textResult = dataCache[dateKey].text;
                imgUrl = dataCache[dateKey].img;
            } else {
                loading.classList.remove('hidden');
                empty.classList.add('hidden');
                content.classList.add('hidden');

                const hasTxt = fileIndex ? !!fileIndex[`${dateKey}.txt`] : true;
                const txtUrl = `${RAW_BASE_URL}/${dateKey}.txt`;

                let validImgUrl = null;
                if (fileIndex) {
                    const exts = ['jpg', 'png', 'jpeg'];
                    for (let ext of exts) {
                        if (fileIndex[`${dateKey}.${ext}`]) {
                            validImgUrl = `${RAW_BASE_URL}/${dateKey}.${ext}`;
                            break;
                        }
                    }
                } else {
                    validImgUrl = await findValidImage(dateKey);
                }

                [textResult, imgUrl] = await Promise.all([
                    hasTxt ? fetchText(txtUrl) : Promise.resolve(null),
                    Promise.resolve(validImgUrl)
                ]);

                dataCache[dateKey] = { text: textResult, img: imgUrl };
            }

            loading.classList.add('hidden');
            const hasText = textResult !== null;
            const hasImg = imgUrl !== null;

            if (!hasText && !hasImg) {
                content.classList.add('hidden');
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                content.classList.remove('hidden');

                if (hasText) {
                    textContainer.innerText = textResult;
                    textContainer.className = "flex-1 text-sm leading-relaxed whitespace-pre-line bg-black/5 dark:bg-black/25 p-4 rounded-2xl border border-black/5 dark:border-white/5 text-gray-800 dark:text-slate-300 block text-left";
                } else {
                    textContainer.innerText = "(No text record for this date)";
                    textContainer.className = "flex-1 text-sm leading-relaxed whitespace-pre-line bg-black/5 dark:bg-black/25 p-4 rounded-2xl border border-black/5 dark:border-white/5 flex items-center justify-center text-gray-400 dark:text-gray-500 text-center";
                }

                if (hasImg) {
                    img.src = imgUrl;
                    imgContainer.classList.remove('hidden');
                    noImgLabel.classList.add('hidden');
                } else {
                    imgContainer.classList.add('hidden');
                    noImgLabel.classList.remove('hidden');
                }
            }
        }

        async function fetchText(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return await res.text();
            } catch (e) {}
            return null;
        }

        async function findValidImage(dateKey) {
            const extensions = ['jpg', 'png', 'jpeg'];
            const promises = extensions.map(ext => {
                const testUrl = `${RAW_BASE_URL}/${dateKey}.${ext}`;
                return checkImageExists(testUrl).then(exists => exists ? testUrl : null);
            });

            const results = await Promise.all(promises);
            return results.find(url => url !== null) || null;
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const testImg = new Image();
                testImg.onload = () => resolve(true);
                testImg.onerror = () => resolve(false);
                testImg.src = url;
            });
        }
    </script>
</body>
