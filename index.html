<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --theme-blue: #0A6DFF; --bg-gray: #f4f5f7; }
        body { background-color: var(--bg-gray); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .theme-header { background-color: var(--theme-blue); }
        .calendar-day.active { background-color: var(--theme-blue); color: white; font-weight: bold; border-color: var(--theme-blue); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部標題列 -->
    <header class="theme-header text-white text-center py-3 shadow-md sticky top-0 z-50">
        <h1 class="text-lg md:text-xl font-bold tracking-wide">每日紀錄</h1>
    </header>

    <!-- 主要內容區：左右分欄 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側 1/3：萬年曆卡片 -->
        <section class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col justify-between h-fit">
            <div>
                <!-- 月份切換列 (置中顯示與左右箭頭) -->
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-100">
                    <button onclick="changeMonth(-1)" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg transition font-bold">&lt;</button>
                    <h2 id="calendar-month-label" class="text-base font-bold text-gray-800"></h2>
                    <button onclick="changeMonth(1)" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg transition font-bold">&gt;</button>
                </div>

                <!-- 萬年曆網格 (星期一至日 + 日期) -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5">
                    <!-- JS 動態生成 -->
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-400 text-center">
                當前選擇：<span id="selected-date-label" class="font-bold text-gray-700"></span>
            </div>
        </section>

        <!-- 右側 2/3：文字紀錄與圖片展現 -->
        <section class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 min-h-[450px] flex flex-col">
            
            <!-- 狀態：載入中 -->
            <div id="loading-state" class="flex-1 flex flex-col items-center justify-center py-12">
                <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-gray-400 text-sm mt-3">載入資料中...</p>
            </div>

            <!-- 狀態：當天無紀錄 -->
            <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center py-12 text-gray-400">
                <svg class="w-16 h-16 mb-2 stroke-current opacity-40" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-base font-medium">該日期無紀錄</p>
            </div>

            <!-- 狀態：顯示內容 -->
            <div id="content-state" class="hidden flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                
                <!-- 左側 2/3：文字內容區 -->
                <div class="md:col-span-2 space-y-4">
                    <h3 class="text-base font-bold text-blue-600 border-b pb-2 border-gray-100 flex items-center gap-2">
                        <span>📝</span> 文字紀錄
                    </h3>
                    <div id="text-container" class="text-gray-700 text-sm leading-relaxed whitespace-pre-line bg-gray-50 p-4 rounded-xl border border-gray-100 min-h-[200px]">
                        <!-- 動態載入 .txt 內容 -->
                    </div>
                </div>

                <!-- 右側 1/3：圖片展示區 -->
                <div class="md:col-span-1 space-y-4">
                    <h3 class="text-base font-bold text-blue-600 border-b pb-2 border-gray-100 flex items-center gap-2">
                        <span>🖼️</span> 附圖
                    </h3>
                    <div id="image-container" class="rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-50 flex items-center justify-center">
                        <img id="daily-photo" src="" alt="當日圖片" class="w-full h-auto object-cover max-h-[350px] cursor-pointer" onclick="window.open(this.src, '_blank')">
                    </div>
                    <p id="no-img-label" class="text-xs text-gray-400 text-center hidden">今日無附圖</p>
                </div>

            </div>

        </section>

    </main>

    <script>
        // === 你的 GitHub 設定 ===
        const GITHUB_USERNAME = "lkyam127";
        const GITHUB_REPO = "CSS_26-27_3B_HW_Photos";
        const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/images`;

        // 日期狀態
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth() + 1; // 1-12
        let selectedDay = currentDate.getDate();

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            updateContent();
        });

        // 切換月份按鈕事件
        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            } else if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderCalendar();
        }

        // 渲染萬年曆網格
        function renderCalendar() {
            document.getElementById('calendar-month-label').innerText = `${currentYear}年 ${currentMonth}月`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // 星期列表
            const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
            weekdays.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'text-center text-xs font-bold text-gray-400 py-1';
                div.innerText = wd;
                grid.appendChild(div);
            });

            // 計算當月第一天是星期幾 (0 是週日，轉為週一開始：0-6)
            const firstDayIndex = (new Date(currentYear, currentMonth - 1, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();

            // 補齊上個月空白格
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                grid.appendChild(emptyDiv);
            }

            // 填入當月日期
            for (let d = 1; d <= totalDays; d++) {
                const btn = document.createElement('button');
                const isSelected = (d === selectedDay && currentMonth === (new Date()).getMonth() + 1 && currentYear === (new Date()).getFullYear()); // 簡化選取比對
                
                btn.className = `calendar-day aspect-square flex items-center justify-center text-xs rounded-lg border border-gray-100 text-gray-700 hover:bg-blue-50 transition ${d === selectedDay ? 'active' : 'bg-gray-50'}`;
                btn.innerText = d;
                btn.onclick = () => {
                    selectedDay = d;
                    renderCalendar();
                    updateContent();
                };
                grid.appendChild(btn);
            }
        }

        // 讀取當天文字與圖片（支援 .jpg, .jpeg, .png）
        async function updateContent() {
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            const content = document.getElementById('content-state');
            const textContainer = document.getElementById('text-container');
            const img = document.getElementById('daily-photo');
            const noImgLabel = document.getElementById('no-img-label');
            const imgContainer = document.getElementById('image-container');

            const monthStr = currentMonth.toString().padStart(2, '0');
            const dayStr = selectedDay.toString().padStart(2, '0');
            const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

            document.getElementById('selected-date-label').innerText = `${currentYear}年 ${monthStr}月 ${dayStr}日`;

            loading.classList.remove('hidden');
            empty.classList.add('hidden');
            content.classList.add('hidden');

            const txtUrl = `${RAW_BASE_URL}/${dateKey}.txt`;
            
            let hasText = false;
            let imgUrl = '';

            // 1. 抓取文字檔
            try {
                const res = await fetch(txtUrl);
                if (res.ok) {
                    const text = await res.text();
                    textContainer.innerText = text;
                    hasText = true;
                }
            } catch (e) { hasText = false; }

            // 2. 自動偵測圖片副檔名 (.jpg, .jpeg, .png)
            const extensions = ['jpg', 'jpeg', 'png'];
            for (let ext of extensions) {
                const testUrl = `${RAW_BASE_URL}/${dateKey}.${ext}`;
                const exists = await checkImageExists(testUrl);
                if (exists) {
                    imgUrl = testUrl;
                    break;
                }
            }

            loading.classList.add('hidden');

            const hasImg = imgUrl !== '';

            if (!hasText && !hasImg) {
                empty.classList.remove('hidden');
            } else {
                content.classList.remove('hidden');
                
                if (!hasText) {
                    textContainer.innerText = "（當天未上傳文字紀錄）";
                }

                if (hasImg) {
                    img.src = imgUrl;
                    imgContainer.classList.remove('hidden');
                    noImgLabel.classList.add('hidden');
                } else {
                    imgContainer.classList.add('hidden');
                    noImgLabel.classList.remove('hidden');
                }
            }
        }

        // 檢查圖片是否存在的小工具
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const testImg = new Image();
                testImg.onload = () => resolve(true);
                testImg.onerror = () => resolve(false);
                testImg.src = url;
            });
        }
    </script>
</body>
</html>
