<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Homework</title>
    
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <style>
        :root { 
            --bg-main: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border-color: #e5e7eb;

            --theme-color: #2563eb;
            --theme-text: #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --border-color: #334155;

                --theme-text: #60a5fa;
            }
        }

        [data-theme="blue"] { --theme-color: #2563eb; --theme-text: #2563eb; }
        @media (prefers-color-scheme: dark) { [data-theme="blue"] { --theme-text: #60a5fa; } }

        [data-theme="emerald"] { --theme-color: #059669; --theme-text: #059669; }
        @media (prefers-color-scheme: dark) { [data-theme="emerald"] { --theme-text: #34d399; } }

        [data-theme="purple"] { --theme-color: #7c3aed; --theme-text: #7c3aed; }
        @media (prefers-color-scheme: dark) { [data-theme="purple"] { --theme-text: #a78bfa; } }

        [data-theme="amber"] { --theme-color: #d97706; --theme-text: #d97706; }
        @media (prefers-color-scheme: dark) { [data-theme="amber"] { --theme-text: #fbbf24; } }

        [data-theme="rose"] { --theme-color: #e11d48; --theme-text: #e11d48; }
        @media (prefers-color-scheme: dark) { [data-theme="rose"] { --theme-text: #fb7185; } }

        [data-theme="cyan"] { --theme-color: #0891b2; --theme-text: #0891b2; }
        @media (prefers-color-scheme: dark) { [data-theme="cyan"] { --theme-text: #22d3ee; } }

        [data-theme="indigo"] { --theme-color: #4f46e5; --theme-text: #4f46e5; }
        @media (prefers-color-scheme: dark) { [data-theme="indigo"] { --theme-text: #818cf8; } }

        [data-theme="slate"] { --theme-color: #475569; --theme-text: #475569; }
        @media (prefers-color-scheme: dark) { [data-theme="slate"] { --theme-text: #94a3b8; } }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-bg { background-color: var(--theme-color) !important; }
        .theme-text { color: var(--theme-text); transition: color 0.3s ease; }
        .theme-spinner { border-top-color: var(--theme-color); transition: border-color 0.3s ease; }

        .calendar-day.active { 
            background-color: var(--theme-color) !important; 
            color: #ffffff !important; 
            font-weight: bold; 
            border-color: var(--theme-color) !important; 
        }

        .hdr-image { dynamic-range: high; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="w-full max-w-7xl mx-auto px-4 md:px-6 pt-4 pb-2 flex justify-between items-center sticky top-0 z-40 backdrop-blur-md bg-opacity-80">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full theme-bg transition-colors"></span>
            <h1 class="text-xl font-bold tracking-wide text-gray-800 dark:text-slate-100">Daily Homework</h1>
        </div>
        
        <div class="relative">
            <button id="theme-menu-btn" onclick="toggleThemeMenu(event)" class="p-2 rounded-xl bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 shadow-sm hover:bg-gray-50 dark:hover:bg-slate-700 active:scale-95 transition flex items-center gap-2 cursor-pointer text-xs font-semibold text-gray-700 dark:text-slate-200">
                <svg class="w-4 h-4 theme-text stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4 5 5 0 013-4.586V12a7 7 0 0114 0v.414A5 5 0 0121 17a4 4 0 01-4 4h-1a2 2 0 01-2-2 1 1 0 00-1-1 1 1 0 00-1 1 2 2 0 01-2 2H7z" />
                </svg>
                <span>Theme</span>
            </button>

            <div id="theme-menu" class="hidden absolute right-0 mt-2 w-52 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-200 dark:border-slate-700 p-2 z-50 transition-all">
                <div class="text-xs font-semibold text-gray-400 dark:text-slate-400 px-3 py-1.5 mb-1 border-b border-gray-100 dark:border-slate-700">Select Theme Color</div>
                
                <div class="grid grid-cols-2 gap-1">
                    <button onclick="setTheme('blue')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-blue-600 shrink-0"></span> Blue
                    </button>
                    <button onclick="setTheme('emerald')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-emerald-600 shrink-0"></span> Emerald
                    </button>
                    <button onclick="setTheme('purple')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-purple-600 shrink-0"></span> Purple
                    </button>
                    <button onclick="setTheme('amber')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-amber-600 shrink-0"></span> Amber
                    </button>
                    <button onclick="setTheme('rose')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-rose-600 shrink-0"></span> Rose
                    </button>
                    <button onclick="setTheme('cyan')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-cyan-600 shrink-0"></span> Cyan
                    </button>
                    <button onclick="setTheme('indigo')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-indigo-600 shrink-0"></span> Indigo
                    </button>
                    <button onclick="setTheme('slate')" class="flex items-center gap-2 px-2.5 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="w-3.5 h-3.5 rounded-full bg-slate-600 shrink-0"></span> Slate
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Calendar Card -->
        <section id="left-calendar-card" class="lg:col-span-4 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5 flex flex-col justify-between h-fit transition-colors">
            <div>
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-100 dark:border-slate-700">
                    <button onclick="changeMonth(-1)" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition font-bold">&lt;</button>
                    <h2 id="calendar-month-label" class="text-base font-bold text-gray-800 dark:text-slate-100"></h2>
                    <button onclick="changeMonth(1)" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition font-bold">&gt;</button>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            </div>

            <div class="mt-4 pt-3 border-t border-gray-100 dark:border-slate-700 text-xs text-gray-400 dark:text-gray-400 text-center">
                Selected: <span id="selected-date-label" class="font-bold text-gray-700 dark:text-slate-200"></span>
            </div>
        </section>

        <!-- Content Card -->
        <section id="right-content-card" class="lg:col-span-8 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5 flex flex-col transition-colors min-h-[380px] justify-center items-center">
            
            <!-- Loading State -->
            <div id="loading-state" class="w-full flex-1 flex flex-col items-center justify-center">
                <div class="w-8 h-8 border-4 border-gray-300 theme-spinner rounded-full animate-spin"></div>
                <p class="text-gray-400 text-sm mt-3">Loading data...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden w-full flex-1 flex flex-col items-center justify-center text-gray-400 dark:text-gray-500">
                <svg class="w-14 h-14 mb-2 stroke-current opacity-40" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-base font-medium">No record for this date</p>
            </div>

            <!-- Content State -->
            <div id="content-state" class="hidden w-full flex-1 grid grid-cols-1 md:grid-cols-3 gap-5 items-stretch">
                <!-- Text Container -->
                <div class="md:col-span-2 flex flex-col h-full space-y-3">
                    <h3 class="text-base font-bold theme-text border-b pb-2 border-gray-100 dark:border-slate-700 flex items-center gap-2">
                        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span>Notes</span>
                    </h3>
                    <div id="text-container" class="flex-1 text-sm leading-relaxed whitespace-pre-line bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-100 dark:border-slate-700"></div>
                </div>

                <!-- Image Container -->
                <div class="md:col-span-1 space-y-3 flex flex-col">
                    <h3 class="text-base font-bold theme-text border-b pb-2 border-gray-100 dark:border-slate-700 flex items-center gap-2">
                        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Attachment</span>
                    </h3>
                    <div id="image-container" class="rounded-xl overflow-hidden border border-gray-200 dark:border-slate-700 shadow-sm bg-gray-50 dark:bg-slate-900/50 flex items-center justify-center flex-1">
                        <img id="daily-photo" src="" alt="Daily Photo" class="hdr-image w-full h-auto object-cover max-h-[350px] cursor-pointer" onclick="window.open(this.src, '_blank')">
                    </div>
                    <p id="no-img-label" class="text-xs text-gray-400 dark:text-gray-500 text-center hidden">No photo for today</p>
                </div>
            </div>

        </section>

    </main>

    <script>
        const GITHUB_USERNAME = "lkyam127";
        const GITHUB_REPO = "CSS_26-27_3B_HW_Photos";
        const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/images`;
        const API_CONTENTS_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/images`;

        const dataCache = {};
        let fileIndex = null;

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth() + 1;
        let selectedYear = currentYear;
        let selectedMonth = currentMonth;
        let selectedDay = today.getDate();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function toggleThemeMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('theme-menu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('user-theme', themeName);
            
            const menu = document.getElementById('theme-menu');
            if (menu) menu.classList.add('hidden');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('user-theme') || 'blue';
            setTheme(savedTheme);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            renderCalendar();
            await fetchFileIndex();
            updateContent();
        });

        async function fetchFileIndex() {
            try {
                const res = await fetch(API_CONTENTS_URL);
                if (res.ok) {
                    const files = await res.json();
                    fileIndex = {};
                    files.forEach(f => { fileIndex[f.name] = true; });
                }
            } catch (e) {
                console.error("Failed to fetch file index", e);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }

            selectedYear = currentYear;
            selectedMonth = currentMonth;
            const daysInNewMonth = new Date(selectedYear, selectedMonth, 0).getDate();
            if (selectedDay > daysInNewMonth) selectedDay = daysInNewMonth;

            renderCalendar();
            updateContent();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-label').innerText = `${monthNames[currentMonth - 1]} ${currentYear}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            weekdays.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'text-center text-xs font-bold text-gray-400 dark:text-slate-500 py-1';
                div.innerText = wd;
                grid.appendChild(div);
            });

            const firstDayIndex = (new Date(currentYear, currentMonth - 1, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= totalDays; d++) {
                const btn = document.createElement('button');
                const isSelected = (d === selectedDay && currentMonth === selectedMonth && currentYear === selectedYear);
                btn.className = `calendar-day aspect-square flex items-center justify-center text-xs rounded-lg border border-gray-100 dark:border-slate-700 text-gray-700 dark:text-slate-200 hover:bg-black/5 dark:hover:bg-slate-700 transition ${isSelected ? 'active' : 'bg-gray-50 dark:bg-slate-800'}`;
                btn.innerText = d;
                btn.onclick = () => {
                    selectedYear = currentYear;
                    selectedMonth = currentMonth;
                    selectedDay = d;
                    renderCalendar();
                    updateContent();
                };
                grid.appendChild(btn);
            }
        }

        async function updateContent() {
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            const content = document.getElementById('content-state');
            const textContainer = document.getElementById('text-container');
            const img = document.getElementById('daily-photo');
            const noImgLabel = document.getElementById('no-img-label');
            const imgContainer = document.getElementById('image-container');

            const monthStr = selectedMonth.toString().padStart(2, '0');
            const dayStr = selectedDay.toString().padStart(2, '0');
            const dateKey = `${selectedYear}-${monthStr}-${dayStr}`;

            document.getElementById('selected-date-label').innerText = `${monthNames[selectedMonth - 1]} ${dayStr}, ${selectedYear}`;

            let textResult = null;
            let imgUrl = null;

            if (dataCache[dateKey]) {
                textResult = dataCache[dateKey].text;
                imgUrl = dataCache[dateKey].img;
            } else {
                loading.classList.remove('hidden');
                empty.classList.add('hidden');
                content.classList.add('hidden');

                const hasTxt = fileIndex ? !!fileIndex[`${dateKey}.txt`] : true;
                const txtUrl = `${RAW_BASE_URL}/${dateKey}.txt`;

                let validImgUrl = null;
                if (fileIndex) {
                    const exts = ['jpg', 'png', 'jpeg'];
                    for (let ext of exts) {
                        if (fileIndex[`${dateKey}.${ext}`]) {
                            validImgUrl = `${RAW_BASE_URL}/${dateKey}.${ext}`;
                            break;
                        }
                    }
                } else {
                    validImgUrl = await findValidImage(dateKey);
                }

                [textResult, imgUrl] = await Promise.all([
                    hasTxt ? fetchText(txtUrl) : Promise.resolve(null),
                    Promise.resolve(validImgUrl)
                ]);

                dataCache[dateKey] = { text: textResult, img: imgUrl };
            }

            loading.classList.add('hidden');
            const hasText = textResult !== null;
            const hasImg = imgUrl !== null;

            if (!hasText && !hasImg) {
                content.classList.add('hidden');
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                content.classList.remove('hidden');

                if (hasText) {
                    textContainer.innerText = textResult;
                    textContainer.className = "flex-1 text-sm leading-relaxed whitespace-pre-line bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-100 dark:border-slate-700 text-gray-700 dark:text-slate-200 block text-left";
                } else {
                    textContainer.innerText = "(No text record for this date)";
                    textContainer.className = "flex-1 text-sm leading-relaxed whitespace-pre-line bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-100 dark:border-slate-700 flex items-center justify-center text-gray-400 dark:text-gray-500 text-center";
                }

                if (hasImg) {
                    img.src = imgUrl;
                    imgContainer.classList.remove('hidden');
                    noImgLabel.classList.add('hidden');
                } else {
                    imgContainer.classList.add('hidden');
                    noImgLabel.classList.remove('hidden');
                }
            }
        }

        async function fetchText(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return await res.text();
            } catch (e) {}
            return null;
        }

        async function findValidImage(dateKey) {
            const extensions = ['jpg', 'png', 'jpeg'];
            const promises = extensions.map(ext => {
                const testUrl = `${RAW_BASE_URL}/${dateKey}.${ext}`;
                return checkImageExists(testUrl).then(exists => exists ? testUrl : null);
            });

            const results = await Promise.all(promises);
            return results.find(url => url !== null) || null;
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const testImg = new Image();
                testImg.onload = () => resolve(true);
                testImg.onerror = () => resolve(false);
                testImg.src = url;
            });
        }
    </script>
</body>
</html>
