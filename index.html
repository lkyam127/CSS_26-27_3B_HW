<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Homework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <style>
        :root { 
            --theme-blue: #0A6DFF; 
            --bg-main: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --border-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --border-color: #334155;
            }
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-header { background-color: var(--theme-blue); }
        .calendar-day.active { 
            background-color: var(--theme-blue) !important; 
            color: #ffffff !important; 
            font-weight: bold; 
            border-color: var(--theme-blue) !important; 
        }
        .hdr-image { dynamic-range: high; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="theme-header text-white px-6 py-3 shadow-md sticky top-0 z-40 flex justify-between items-center">
        <div class="w-10"></div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">Daily Homework</h1>
        <button onclick="toggleAdminModal(true)" class="p-1.5 hover:bg-white/20 rounded-lg transition" title="Admin Upload">
            <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left 1/3: Calendar Card -->
        <section class="lg:col-span-4 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5 flex flex-col justify-between h-fit transition-colors">
            <div>
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-100 dark:border-slate-700">
                    <button onclick="changeMonth(-1)" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition font-bold">&lt;</button>
                    <h2 id="calendar-month-label" class="text-base font-bold text-gray-800 dark:text-slate-100"></h2>
                    <button onclick="changeMonth(1)" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition font-bold">&gt;</button>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100 dark:border-slate-700 text-xs text-gray-400 dark:text-gray-400 text-center">
                Selected: <span id="selected-date-label" class="font-bold text-gray-700 dark:text-slate-200"></span>
            </div>
        </section>

        <!-- Right 2/3: Content Card (高度自動適應) -->
        <section class="lg:col-span-8 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700 p-5 h-fit transition-colors">
            
            <div id="loading-state" class="flex flex-col items-center justify-center py-8">
                <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-gray-400 text-sm mt-3">Loading data...</p>
            </div>

            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-8 text-gray-400 dark:text-gray-500">
                <svg class="w-14 h-14 mb-2 stroke-current opacity-40" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-base font-medium">No record for this date</p>
            </div>

            <div id="content-state" class="hidden grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
                <!-- Text Container -->
                <div class="md:col-span-2 space-y-3">
                    <h3 class="text-base font-bold text-blue-600 dark:text-blue-400 border-b pb-2 border-gray-100 dark:border-slate-700 flex items-center gap-2">
                        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span>Notes</span>
                    </h3>
                    <div id="text-container" class="text-sm leading-relaxed whitespace-pre-line bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-100 dark:border-slate-700 min-h-[140px] flex items-center justify-center"></div>
                </div>

                <!-- Image Container -->
                <div class="md:col-span-1 space-y-3">
                    <h3 class="text-base font-bold text-blue-600 dark:text-blue-400 border-b pb-2 border-gray-100 dark:border-slate-700 flex items-center gap-2">
                        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Attachment</span>
                    </h3>
                    <div id="image-container" class="rounded-xl overflow-hidden border border-gray-200 dark:border-slate-700 shadow-sm bg-gray-50 dark:bg-slate-900/50 flex items-center justify-center">
                        <img id="daily-photo" src="" alt="Daily Photo" class="hdr-image w-full h-auto object-cover max-h-[300px] cursor-pointer" onclick="window.open(this.src, '_blank')">
                    </div>
                    <p id="no-img-label" class="text-xs text-gray-400 dark:text-gray-500 text-center hidden">No photo for today</p>
                </div>
            </div>

        </section>

    </main>

    <!-- Admin Upload Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-gray-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b pb-3 border-gray-100 dark:border-slate-700">
                <h3 class="text-base font-bold text-gray-800 dark:text-slate-100">Upload Record</h3>
                <button onclick="toggleAdminModal(false)" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
            </div>

            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Target Date</label>
                    <input type="text" id="upload-date-display" disabled class="w-full bg-gray-100 dark:bg-slate-700 px-3 py-2 rounded-lg font-mono font-bold text-gray-700 dark:text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Admin Password</label>
                    <input type="password" id="admin-password" placeholder="Enter password" class="w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-900 px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Notes (.txt)</label>
                    <textarea id="upload-text" rows="3" placeholder="Enter notes for this date..." class="w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-900 px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Photo (JPEG / PNG)</label>
                    <input type="file" id="upload-image" accept="image/*" class="w-full text-xs text-gray-500">
                </div>
            </div>

            <div class="pt-2 flex justify-end gap-2">
                <button onclick="toggleAdminModal(false)" class="px-4 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg">Cancel</button>
                <button id="upload-submit-btn" onclick="handleUploadSubmit()" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">Upload & Commit</button>
            </div>
        </div>
    </div>

    <script>
        // === Configuration ===
        const GITHUB_USERNAME = "lkyam127";
        const GITHUB_REPO = "CSS_26-27_3B_HW_Photos";
        const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/images`;
        
        // 請將下方網址替換為你在 Cloudflare 產生的 Worker URL
        const WORKER_URL = "https://YOUR_WORKER_SUBDOMAIN.workers.dev";

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth() + 1;
        let selectedYear = currentYear;
        let selectedMonth = currentMonth;
        let selectedDay = today.getDate();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            updateContent();
        });

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }

            selectedYear = currentYear;
            selectedMonth = currentMonth;
            const daysInNewMonth = new Date(selectedYear, selectedMonth, 0).getDate();
            if (selectedDay > daysInNewMonth) selectedDay = daysInNewMonth;

            renderCalendar();
            updateContent();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-label').innerText = `${monthNames[currentMonth - 1]} ${currentYear}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            weekdays.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'text-center text-xs font-bold text-gray-400 dark:text-slate-500 py-1';
                div.innerText = wd;
                grid.appendChild(div);
            });

            const firstDayIndex = (new Date(currentYear, currentMonth - 1, 1).getDay() + 6) % 7;
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= totalDays; d++) {
                const btn = document.createElement('button');
                const isSelected = (d === selectedDay && currentMonth === selectedMonth && currentYear === selectedYear);
                btn.className = `calendar-day aspect-square flex items-center justify-center text-xs rounded-lg border border-gray-100 dark:border-slate-700 text-gray-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-slate-700 transition ${isSelected ? 'active' : 'bg-gray-50 dark:bg-slate-800'}`;
                btn.innerText = d;
                btn.onclick = () => {
                    selectedYear = currentYear;
                    selectedMonth = currentMonth;
                    selectedDay = d;
                    renderCalendar();
                    updateContent();
                };
                grid.appendChild(btn);
            }
        }

        async function updateContent() {
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            const content = document.getElementById('content-state');
            const textContainer = document.getElementById('text-container');
            const img = document.getElementById('daily-photo');
            const noImgLabel = document.getElementById('no-img-label');
            const imgContainer = document.getElementById('image-container');

            const monthStr = selectedMonth.toString().padStart(2, '0');
            const dayStr = selectedDay.toString().padStart(2, '0');
            const dateKey = `${selectedYear}-${monthStr}-${dayStr}`;

            document.getElementById('selected-date-label').innerText = `${monthNames[selectedMonth - 1]} ${dayStr}, ${selectedYear}`;

            loading.classList.remove('hidden');
            empty.classList.add('hidden');
            content.classList.add('hidden');

            const txtUrl = `${RAW_BASE_URL}/${dateKey}.txt`;
            let hasText = false;
            let imgUrl = '';

            try {
                const res = await fetch(txtUrl);
                if (res.ok) {
                    textContainer.innerText = await res.text();
                    textContainer.className = "text-sm leading-relaxed whitespace-pre-line bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-100 dark:border-slate-700 min-h-[140px] text-gray-700 dark:text-slate-200 block text-left";
                    hasText = true;
                }
            } catch (e) { hasText = false; }

            const extensions = ['jpg', 'jpeg', 'png'];
            for (let ext of extensions) {
                const testUrl = `${RAW_BASE_URL}/${dateKey}.${ext}`;
                if (await checkImageExists(testUrl)) { imgUrl = testUrl; break; }
            }

            loading.classList.add('hidden');
            const hasImg = imgUrl !== '';

            if (!hasText && !hasImg) {
                empty.classList.remove('hidden');
            } else {
                content.classList.remove('hidden');
                if (!hasText) {
                    textContainer.innerText = "(No text record for this date)";
                    textContainer.className = "text-sm leading-relaxed whitespace-pre-line bg-gray-50 dark:bg-slate-900/50 p-4 rounded-xl border border-gray-100 dark:border-slate-700 min-h-[140px] flex items-center justify-center text-gray-400 dark:text-gray-500 text-center";
                }
                if (hasImg) {
                    img.src = imgUrl;
                    imgContainer.classList.remove('hidden');
                    noImgLabel.classList.add('hidden');
                } else {
                    imgContainer.classList.add('hidden');
                    noImgLabel.classList.remove('hidden');
                }
            }
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const testImg = new Image();
                testImg.onload = () => resolve(true);
                testImg.onerror = () => resolve(false);
                testImg.src = url;
            });
        }

        // Modal Handler
        function toggleAdminModal(show) {
            const modal = document.getElementById('admin-modal');
            if (show) {
                const monthStr = selectedMonth.toString().padStart(2, '0');
                const dayStr = selectedDay.toString().padStart(2, '0');
                document.getElementById('upload-date-display').value = `${selectedYear}-${monthStr}-${dayStr}`;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // Submit to Cloudflare Worker
        async function handleUploadSubmit() {
            const password = document.getElementById('admin-password').value;
            const textContent = document.getElementById('upload-text').value;
            const fileInput = document.getElementById('upload-image');
            const btn = document.getElementById('upload-submit-btn');

            if (!password) { alert('Please enter password'); return; }
            if (!textContent && fileInput.files.length === 0) { alert('Please enter text or select an image'); return; }

            const dateKey = document.getElementById('upload-date-display').value;
            btn.disabled = true;
            btn.innerText = "Uploading...";

            try {
                if (textContent) {
                    await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${password}`
                        },
                        body: JSON.stringify({
                            filename: `${dateKey}.txt`,
                            content: textContent,
                            isBase64: false
                        })
                    });
                }

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const ext = file.name.split('.').pop().toLowerCase();
                    const base64Str = await fileToBase64(file);

                    await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${password}`
                        },
                        body: JSON.stringify({
                            filename: `${dateKey}.${ext}`,
                            content: base64Str.split(',')[1],
                            isBase64: true
                        })
                    });
                }

                alert('Uploaded! GitHub Pages will refresh in 1-2 minutes.');
                toggleAdminModal(false);
                setTimeout(updateContent, 3000);
            } catch (err) {
                alert('Upload failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Upload & Commit";
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
